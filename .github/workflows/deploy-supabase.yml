name: Deploy Supabase

# Staging gets every merge to main; production gets published releases (and the
# GitHub "production" environment should require a reviewer). See docs/environments.md.

on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
    concurrency:
      group: supabase-${{ github.event_name == 'release' && 'production' || inputs.target || 'staging' }}
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$PROJECT_REF"
      - name: Show pending migrations
        run: npx supabase migration list
      - name: Apply migrations (never the seed)
        run: npx supabase db push
      - name: Deploy Edge Functions
        run: npx supabase functions deploy --project-ref "$PROJECT_REF"
