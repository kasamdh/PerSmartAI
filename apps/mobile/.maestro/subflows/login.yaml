# Signs in from a fresh install. Params: EMAIL, PASSWORD (seed users use password123).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Log in"
- tapOn:
    id: "sign-in-email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Log in"
# Push permission prompt (first launch on a device).
- runFlow:
    when:
      visible: "Allow"
    commands:
      - tapOn: "Allow"
- extendedWaitUntil:
    notVisible:
      id: "sign-in-email"
    timeout: 15000
