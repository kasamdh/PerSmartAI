# Wrong password is refused, the right one lands on the owner's home.
appId: ${APP_ID}
name: Login
tags: [smoke]
---
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn: "Log in"
- tapOn:
    id: "sign-in-email"
- inputText: "rudradh@gmail.com"
- tapOn:
    id: "sign-in-password"
- inputText: "wrong-password"
- hideKeyboard
- tapOn: "Log in"
- assertVisible: "Email or password is incorrect."
- runFlow:
    file: subflows/login.yaml
    env:
      EMAIL: "rudradh@gmail.com"
      PASSWORD: "password123"
- assertVisible: "My pets"
- assertVisible: "Book a visit"
